# i3blocks config file changed for EndeavourOS-i3 setup

# source is available here:
# https://raw.githubusercontent.com/endeavouros-team/endeavouros-i3wm-setup/main/.config/i3/i3blocks.conf
# Maintainer: joekamprad [joekamprad@endeavouros.com]
# Former Visual Designer: Florent Valetti [@FLVAL EndeavourOS]
# created for i3wm setup on EndeavourOS
# https://endeavouros.com

# cheatsheet for icon fonts used on the block-bar:
# https://fontawesome.com/v4.7/cheatsheet/

# --> to update this run the following command:
# wget --backups=1 https://raw.githubusercontent.com/endeavouros-team/endeavouros-i3wm-setup/main/.config/i3/i3blocks.conf -P ~/.config/i3/

# Please see man i3blocks for a complete reference!
# The man page is also hosted at http://vivien.github.io/i3blocks


# List of valid properties:
#
# align
# color
# command
# full_text
# instance
# interval
# label
# min_width
# name
# separator
# separator_block_width
# short_text
# signal
# urgent

# Global properties
#
# The top properties below are applied to every block, but can be overridden.
separator=false
markup=pango

# =====================================================================
# LAYOUT
#
# Left to right, grouped by what the information is for:
#
#     load  |  audio  |  actions  |  clock     <tray: bluetooth, wifi>
#
# Read-only telemetry sits left, where it is ambient and never clicked.
# Everything clickable is grouped together after it. The clock is last
# because it is the most-glanced item and the tray is pinned to the right
# edge, so this is as close to the corner as a block can get.
#
# Separators are [simple-2] blocks rather than i3blocks' own `separator`,
# which is off globally above. They mark group boundaries only — never
# between two blocks that belong to the same group.
# =====================================================================

# --- load ------------------------------------------------- read-only
# One family, so no separators between them: RAM, CPU, temperature.
# [memory] reports "mem" unless an instance says otherwise.
[memory]
label= 
command=~/.config/i3/scripts/memory
interval=2

[cpu_usage]
label= 
command=~/.config/i3/scripts/cpu_usage
#min_width=CPU: 100.00%
interval=2

[CPU-temperature]
label=
command=~/.config/i3/scripts/temperature
interval=30
T_WARN=70
T_CRIT=90
#SENSOR_CHIP=""
# where SENSOR_CHIP can be find with sensors output
# can be used also for GPU temperature or other temperature sensors lm-sensors detects.

# GPU last in the group: its "GPU" prefix restarts the reading after the CPU
# figures, so two temperatures side by side cannot be misread as one.
[gpu]
command=~/.config/i3/scripts/gpu
interval=5

[simple-2]
full_text=|
color=#717171

# --- audio ------------------------------------ icon opens pavucontrol
# The icon and the percentage are one unit: click the icon, read the
# number. Bluetooth follows the same idea in the tray, via blueman.
[pavucontrol]
full_text=
command=pavucontrol

[volume-pulseaudio]
command=~/.config/i3/scripts/volume
instance=Master
interval=1

# Mic beside the speaker, because "what is my audio doing" is one question.
# Left click toggles mute, right click opens pavucontrol on Input Devices.
[microphone]
command=~/.config/i3/scripts/microphone
interval=5

[simple-2]
full_text=|
color=#717171

# --- actions -------------------------------------------- click-only
# [updates] prints nothing when the system is current, so it collapses to zero
# width. Inside the group that is invisible; next to its own separator it
# would leave a divider with nothing on one side.
[updates]
command=~/.config/i3/scripts/updates
interval=1800

[keybindings]
full_text=
command=~/.config/i3/scripts/keyhint

[shutdown_menu]
full_text=
command=~/.config/i3/scripts/powermenu

[simple-2]
full_text=|
color=#717171

# --- clock ------------------------------------------- HH:MM | dd/mm
# One block, not two: a single `date` call cannot show a time and a date
# that disagree across a midnight or minute rollover, and it spawns one
# process per tick instead of two.
#
# Its divider is deliberately dimmer than the [simple-2] group dividers
# (#717171): time and date are one group, and at equal weight the eye
# reads "17:18 | 19/08" as two. #5a5f6b sits between the divider grey and
# the bar background #383c4a, so it separates without competing.
[time]
command=date '+%H:%M <span color="#5a5f6b">|</span> %d/%m'
interval=1

# Divider between the status blocks and the tray icons.
[simple-2]
full_text=|
color=#717171

# =====================================================================
# DISABLED BLOCKS
#
# Kept for reference, none of them active. Uncomment and move into the
# groups above rather than appending here, or the layout drifts back to
# whatever order things were added in.
# =====================================================================

