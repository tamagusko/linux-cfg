# BACKUP of the three-monitor workspace assignment from dotfiles/i3/config,
# kept on 2026-09-07 when the main monitor (DP-5) died. Not read by i3.
# See layouts/three-monitors/monitor-layout for the restore steps.
#
#          ┌──────────────┐ ┌────┐
#          │    DP-5      │ │DP-2│   Dell P2014H, rotated, right of main
#          │    main      │ │    │
#          └──────────────┘ └────┘
#          ┌────────┐
#          │ HDMI-0 │   MSI MP161 E2, below the main screen
#          └────────┘
#
# ---------------------------------------------------------------------------

#######################
# monitor assignment: #
#######################

# Output names for this machine. Get them with:
#
#     xrandr --listmonitors
#
# or ./scripts/monitors.sh in this repo, which also prints geometry and
# rotation so it is obvious which is which.
#
# Names verified on this machine 2026-08-19. If the hardware changes, re-run
# ./scripts/monitors.sh and update these three lines.
# NOTE: no trailing comments on these lines. i3's `set` takes the entire rest
# of the line as the value, comment included, so `set $mon_main DP-5  # main`
# defines $mon_main as "DP-5  # main" and every workspace line built from it
# becomes a parse error.
#
#   mon_main   big central monitor
#   mon_vert   rotated portrait, right, auxiliary
#   mon_small  smaller monitor below the main one
set $mon_main DP-5
set $mon_vert DP-2
set $mon_small HDMI-0

# Workspace -> output.
#
# Each line names a preferred output followed by a fallback. i3 uses the first
# that exists, so unplugging a monitor relocates its workspaces rather than
# losing them.
#
#   main   big central monitor
#   vert   rotated portrait monitor on the right, auxiliary
#   small  smaller monitor below the main one

workspace $ws1  output $mon_small $mon_main
workspace $ws2  output $mon_main  $mon_vert
workspace $ws5  output $mon_main  $mon_vert

workspace $ws3  output $mon_vert  $mon_main
workspace $ws4  output $mon_vert  $mon_main
workspace $ws6  output $mon_vert  $mon_main
workspace $ws7  output $mon_vert  $mon_main
workspace $ws8  output $mon_vert  $mon_main

# Not requested; default to the main screen.
workspace $ws9  output $mon_main  $mon_vert
workspace $ws10 output $mon_main  $mon_vert
